<!DOCTYPE html>
<html>
<head>
    <title>World Map Explorer</title>
</head>
<body>

    <h1>World Map Explorer</h1>
    <p>Click on a country in the map to learn about it.</p>

    <img src="images/world-map.png" width="900" height="450"
         alt="World Map" usemap="#worldmap">

    <map name="worldmap">
        <area shape="circle" coords="205,130,30" href="https://en.wikipedia.org/wiki/United_States" alt="USA" target="_blank">
        <area shape="circle" coords="795,132,29" href="https://en.wikipedia.org/wiki/Japan" alt="Japan" target="_blank">
        <area shape="rect" coords="291,227,350,265" href="https://en.wikipedia.org/wiki/Brazil" alt="Brazil" target="_blank">
        <area shape="rect" coords="426,90,481,124" href="https://en.wikipedia.org/wiki/France" alt="France" target="_blank">
        <area shape="poly" coords="607,146,683,146,691,177,660,204,614,190" href="https://en.wikipedia.org/wiki/India" alt="India" target="_blank">
        <area shape="poly" coords="743,267,814,269,830,295,812,321,759,320,741,295" href="https://en.wikipedia.org/wiki/Australia" alt="Australia" target="_blank">
        <area shape="default" href="https://en.wikipedia.org/wiki/Earth" alt="Earth" target="_blank">
    </map>

    <h2>Countries</h2>
    <ul>
        <li><a href="https://en.wikipedia.org/wiki/United_States" target="_blank">USA</a></li>
        <li><a href="https://en.wikipedia.org/wiki/Brazil" target="_blank">Brazil</a></li>
        <li><a href="https://en.wikipedia.org/wiki/France" target="_blank">France</a></li>
        <li><a href="https://en.wikipedia.org/wiki/India" target="_blank">India</a></li>
        <li><a href="https://en.wikipedia.org/wiki/Japan" target="_blank">Japan</a></li>
        <li><a href="https://en.wikipedia.org/wiki/Australia" target="_blank">Australia</a></li>
    </ul>

    <p>Map made using Natural Earth geographical data.</p>

</body>
</html>
