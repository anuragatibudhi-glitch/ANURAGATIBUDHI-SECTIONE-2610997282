<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Hotel Booking</title>
    </head>
    <body>
        <table border="1" cellpadding="10" cellspacing="2">
            <tr>
                <th colspan="3">Hotel Booking</th>
            </tr>
            <tr>
                <th rowspan="3">Hotel Information</th>
                <th>Booking ID</th>
                <td>HB101</td>
            </tr>
            <tr>
                <th>Hotel Name</th>
                <td>Mountain View Hotel</td>
            </tr>
            <tr>
                <th>Room Type</th>
                <td>Deluxe</td>
            </tr>
            <tr>
                <th>Booking Details</th>
                <td colspan="2">
                    <table border="1" cellpadding="8" cellspacing="2">
                        <tr>
                            <th rowspan="3">Stay Details</th>
                            <th>Check-in</th>
                            <td>05-10-2026</td>
                        </tr>
                        <tr>
                            <th>Check-out</th>
                            <td>08-10-2026</td>
                        </tr>
                        <tr>
                            <th>Number of Nights</th>
                            <td>3</td>
                        </tr>
                        <tr>
                            <th rowspan="2">Guest Details</th>
                            <th>Guest Name</th>
                            <td>Anurag</td>
                        </tr>
                        <tr>
                            <th>Number of Guests</th>
                            <td>2</td>
                        </tr>
                    </table>
                </td>
            </tr>
            <tr>
                <th>Booking Status</th>
                <td colspan="2">Confirmed</td>
            </tr>
        </table>
    </body>
</html>
